name: Dizi

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Yayınları Çek (Python Script)
      run: |
        python get_streams.py

    - name: Commit & Push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add dizi/
        if ! git diff --cached --quiet; then
          git commit -m "updated streams $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
          git push
        else
          echo "Değişiklik yok, commit/push atlanıyor."
        fi
